<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Company Banner</title>

    <!-- PART 2: INTERNAL CSS -->
    <style>
      p {
        color: blue;
        font-size: 18px;
        line-height: 1.6;
        font-family: Arial, sans-serif;
      }
      body {
        margin: 0;
        padding: 0;
      }
    </style>

    <!-- PART 3: EXTERNAL CSS LINK -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- PART 1: INLINE CSS ON MAIN HEADING -->
      <h1
        style="color: darkred; font-size: 40px; text-shadow: 2px 2px 4px gray"
      >
        Welcome To Our Website
      </h1>

      <h2>Company Name</h2>

      <!-- INLINE CSS ON ONE PARAGRAPH -->
      <p style="color: green; font-weight: bold; font-size: 20px">
        We provide software solutions for businesses.
      </p>

      <!-- THIS P WILL USE INTERNAL CSS -->
      <p>Our mission is to create simple and useful applications.</p>
    </div>
  </body>
